server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bangla + Arabic everywhere
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/html text/css application/javascript application/json
             image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # search.json is regenerated on every deploy; keep it short-lived
  location = /assets/search.json {
    add_header Cache-Control "public, max-age=3600";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # /class/42 works as well as /class/42.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # A wrong URL still lands on the island map — but with a real 404 status,
  # so search engines never index a phantom page.
  error_page 404 /index.html;
}
