server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bangla + Arabic everywhere
  charset utf-8;
  charset_types text/css application/javascript application/json text/plain;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/html text/css application/javascript application/json
             image/svg+xml text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # search.json is regenerated on every deploy; keep it short-lived
  location = /assets/search.json {
    add_header Cache-Control "public, max-age=3600";
  }

  # Safe to cache hard: build_site.js stamps style.css and app.js with a hash
  # of their own contents (?v=<sha1>), so a changed file gets a new URL and a
  # returning visitor can never be served new HTML against stale CSS/JS.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # Server-side proxy into the self-hosted Supabase project (Arabic_DB).
  # Its Kong gateway is HTTP-only -- browsers block an HTTPS page (this one)
  # from calling an HTTP endpoint directly, so the client talks to this same
  # origin instead and nginx forwards it. Host must stay pinned to Kong's
  # sslip.io name: Coolify's Traefik on this same server routes purely on
  # that header, not on the path.
  location /supabase/ {
    proxy_pass http://supabasekong-x13mvxxre05qxbkdkchtd68u.185.169.252.53.sslip.io/;
    proxy_set_header Host supabasekong-x13mvxxre05qxbkdkchtd68u.185.169.252.53.sslip.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  # /class/42 works as well as /class/42.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # A wrong URL still lands on the island map — but with a real 404 status,
  # so search engines never index a phantom page.
  error_page 404 /index.html;
}
